# Sanitizer fragment for native_sim builds. Applied with:
#   west build -b native_sim/native <app> -- -DEXTRA_CONF_FILE=.github/sanitize.conf
#
# These only work on native_sim / unit_testing -- there is no ASAN for a
# cross-compiled Cortex-M target.
CONFIG_ASAN=y
CONFIG_UBSAN=y

# CONFIG_ASAN_RECOVER defaults to y, which lets ASAN print a report and then
# CARRY ON -- the process still exits 0. Turning it off means a memory error
# actually aborts. The workflow greps the run log as well, because this alone
# is easy to lose to a stray config fragment.
CONFIG_ASAN_RECOVER=n
