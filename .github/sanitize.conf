# Sanitizer fragment for native_sim or unit_testing builds; there is no ASAN for Cortex-M.
#   west build -b native_sim/native <app> -- -DEXTRA_CONF_FILE="$PWD/.github/sanitize.conf"
CONFIG_ASAN=y
CONFIG_UBSAN=y

# Makes a memory error abort. The default (y) prints a report and still exits 0.
# The workflow also greps the run log, in case another fragment turns this back on.
CONFIG_ASAN_RECOVER=n
