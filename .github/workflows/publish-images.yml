name: Publish container images

# Builds and pushes the two consumable images to GHCR:
#
#   ghcr.io/<owner>/zephyr-workshop-ci     Zephyr SDK + tree baked in, for the
#                                          `container:` of the other workflows
#   ghcr.io/<owner>/zephyr-workshop-devel  what devcontainer.json pulls
#
# Both are tagged with the Zephyr/SDK pair from .devcontainer/versions.env, so a
# version bump produces a new tag rather than moving an existing one.
#
# CAVEAT, learned the hard way: the tag is only immutable while versions.env is
# unchanged. Fixing anything else in .devcontainer/ republishes the SAME tag, and
# Docker will keep serving a locally cached copy with no hint it is stale -- a
# bug appears fixed in the registry and unfixed on the machine. After such a
# republish, `docker pull <tag>` is required, not just a container rebuild.
# If that happens once attendees have pulled, give the tag a build suffix
# (z4.4.2-sdk1.0.1-2) here and in both devcontainer.json files instead, so the
# changed reference forces a fetch.
#
# Layer cache is registry-backed (a :buildcache tag per package) rather than
# type=gha, because the GitHub Actions cache is capped at 10 GB per repository and
# the ci image alone is ~14 GB -- mode=max there would thrash the cache for every
# other workflow. GHCR has no such cap.
#
# A third package, zephyr-workshop-base, is pushed as an intermediate. It can stay
# private -- see the comment on that step.
#
# ONE MANUAL STEP after the first successful run: packages are private by default.
# Open zephyr-workshop-devel and zephyr-workshop-ci at
# github.com/users/<owner>/packages and set "Package settings -> Change
# visibility -> Public", or attendees cannot pull without a token. GitHub has no
# API to do this on creation.

on:
  push:
    branches: [main]
    paths:
      - '.devcontainer/**'
      - '.github/workflows/publish-images.yml'
  workflow_dispatch:

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    # Forks would fail on every push -- attendees fork this repo and are not
    # meant to publish. They consume the upstream packages instead.
    if: github.repository == 'royyandzakiy/zephyr-testing-workshop'

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Read versions.env
        id: v
        run: |
          set -euo pipefail
          source .devcontainer/versions.env
          {
            echo "zephyr=$ZEPHYR_VERSION"
            echo "sdk=$ZSDK_VERSION"
            echo "toolchains=$ZSDK_TOOLCHAINS"
            echo "blobs=${ZEPHYR_BLOBS:-}"
            echo "pair=z${ZEPHYR_VERSION#v}-sdk${ZSDK_VERSION}"
          } >> "$GITHUB_OUTPUT"

      # The runner only has ~14 GB free by default and the ci image is large.
      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Lowercased because GHCR rejects uppercase in a repository path, and a
      # GitHub username may contain capitals.
      - name: Compute image prefix
        id: p
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      # base HAS to be pushed, not just `load`ed: buildx's docker-container driver
      # does not share the host daemon's image store, so the devel and ci builds
      # resolve FROM ${BASE_IMAGE} against a registry. A local tag would be looked
      # up as docker.io/library/... and fail with "pull access denied".
      #
      # Nothing outside this workflow consumes base, so leave that package private
      # -- devel and ci are self-contained once pushed.
      - name: Build and push base
        uses: docker/build-push-action@v6
        with:
          context: .devcontainer
          file: .devcontainer/Dockerfile.base
          push: true
          tags: ${{ steps.p.outputs.prefix }}/zephyr-workshop-base:${{ steps.v.outputs.pair }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=registry,ref=${{ steps.p.outputs.prefix }}/zephyr-workshop-base:buildcache
          cache-to: type=registry,ref=${{ steps.p.outputs.prefix }}/zephyr-workshop-base:buildcache,mode=max

      - name: Build and push devel
        uses: docker/build-push-action@v6
        with:
          context: .devcontainer
          file: .devcontainer/Dockerfile.devel
          build-args: BASE_IMAGE=${{ steps.p.outputs.prefix }}/zephyr-workshop-base:${{ steps.v.outputs.pair }}
          push: true
          tags: |
            ${{ steps.p.outputs.prefix }}/zephyr-workshop-devel:${{ steps.v.outputs.pair }}
            ${{ steps.p.outputs.prefix }}/zephyr-workshop-devel:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=Zephyr development (devcontainer) image - Zephyr ${{ steps.v.outputs.zephyr }}, SDK ${{ steps.v.outputs.sdk }}
          cache-from: type=registry,ref=${{ steps.p.outputs.prefix }}/zephyr-workshop-devel:buildcache
          cache-to: type=registry,ref=${{ steps.p.outputs.prefix }}/zephyr-workshop-devel:buildcache,mode=max

      - name: Build and push ci
        uses: docker/build-push-action@v6
        with:
          context: .devcontainer
          file: .devcontainer/Dockerfile.ci
          build-args: |
            BASE_IMAGE=${{ steps.p.outputs.prefix }}/zephyr-workshop-base:${{ steps.v.outputs.pair }}
            ZEPHYR_VERSION=${{ steps.v.outputs.zephyr }}
            ZSDK_VERSION=${{ steps.v.outputs.sdk }}
            ZSDK_TOOLCHAINS=${{ steps.v.outputs.toolchains }}
            ZEPHYR_BLOBS=${{ steps.v.outputs.blobs }}
          push: true
          tags: |
            ${{ steps.p.outputs.prefix }}/zephyr-workshop-ci:${{ steps.v.outputs.pair }}
            ${{ steps.p.outputs.prefix }}/zephyr-workshop-ci:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=Zephyr CI build (GitHub Actions) image - Zephyr ${{ steps.v.outputs.zephyr }}, SDK ${{ steps.v.outputs.sdk }}
          cache-from: type=registry,ref=${{ steps.p.outputs.prefix }}/zephyr-workshop-ci:buildcache
          cache-to: type=registry,ref=${{ steps.p.outputs.prefix }}/zephyr-workshop-ci:buildcache,mode=max

      - name: Summary
        run: |
          {
            echo "### Published"
            echo ""
            echo '| Image | Tag |'
            echo '|---|---|'
            echo "| \`${{ steps.p.outputs.prefix }}/zephyr-workshop-devel\` | \`${{ steps.v.outputs.pair }}\`, \`latest\` |"
            echo "| \`${{ steps.p.outputs.prefix }}/zephyr-workshop-ci\` | \`${{ steps.v.outputs.pair }}\`, \`latest\` |"
            echo ""
            echo "Zephyr ${{ steps.v.outputs.zephyr }}, SDK ${{ steps.v.outputs.sdk }}"
          } >> "$GITHUB_STEP_SUMMARY"
