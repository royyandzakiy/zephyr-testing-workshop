name: Publish container images

# Builds and pushes the two consumable images to GHCR:
#
#   ghcr.io/<owner>/zephyr-workshop-ci     Zephyr SDK + tree baked in, for the
#                                          `container:` of the other workflows
#   ghcr.io/<owner>/zephyr-workshop-devel  what devcontainer.json pulls
#
# Both are tagged with the Zephyr/SDK pair from .devcontainer/versions.env, so a
# version bump produces a NEW immutable tag rather than moving an existing one.
# Attendees pin that tag; nothing shifts under them mid-workshop.
#
# ONE MANUAL STEP after the first successful run: both packages are private by
# default. Open each at github.com/users/<owner>/packages and set
# "Package settings -> Change visibility -> Public", or attendees cannot pull
# without a token. GitHub has no API to do this on creation.

on:
  push:
    branches: [main]
    paths:
      - '.devcontainer/**'
      - '.github/workflows/publish-images.yml'
  workflow_dispatch:
    inputs:
      push:
        description: 'Push to GHCR (uncheck to build only)'
        type: boolean
        default: true

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    # Forks would fail on every push -- attendees fork this repo and are not
    # meant to publish. They consume the upstream packages instead.
    if: github.repository == 'royyandzakiy/zephyr-testing-workshop'

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Read versions.env
        id: v
        run: |
          set -euo pipefail
          source .devcontainer/versions.env
          {
            echo "zephyr=$ZEPHYR_VERSION"
            echo "sdk=$ZSDK_VERSION"
            echo "toolchains=$ZSDK_TOOLCHAINS"
            echo "blobs=${ZEPHYR_BLOBS:-}"
            echo "pair=z${ZEPHYR_VERSION#v}-sdk${ZSDK_VERSION}"
          } >> "$GITHUB_OUTPUT"

      # The runner only has ~14 GB free by default and the ci image is large.
      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Lowercased because GHCR rejects uppercase in a repository path, and a
      # GitHub username may contain capitals.
      - name: Compute image prefix
        id: p
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      # base is an intermediate: built, cached, never pushed.
      - name: Build base
        uses: docker/build-push-action@v6
        with:
          context: .devcontainer
          file: .devcontainer/Dockerfile.base
          tags: zephyr-workshop-base:ci
          load: true
          push: false
          cache-from: type=gha,scope=base
          cache-to: type=gha,scope=base,mode=max

      - name: Build and push devel
        uses: docker/build-push-action@v6
        with:
          context: .devcontainer
          file: .devcontainer/Dockerfile.devel
          build-args: BASE_IMAGE=zephyr-workshop-base:ci
          push: ${{ github.event_name != 'workflow_dispatch' || inputs.push }}
          tags: |
            ${{ steps.p.outputs.prefix }}/zephyr-workshop-devel:${{ steps.v.outputs.pair }}
            ${{ steps.p.outputs.prefix }}/zephyr-workshop-devel:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=Zephyr development (devcontainer) image - Zephyr ${{ steps.v.outputs.zephyr }}, SDK ${{ steps.v.outputs.sdk }}
          cache-from: type=gha,scope=devel
          cache-to: type=gha,scope=devel,mode=max

      - name: Build and push ci
        uses: docker/build-push-action@v6
        with:
          context: .devcontainer
          file: .devcontainer/Dockerfile.ci
          build-args: |
            BASE_IMAGE=zephyr-workshop-base:ci
            ZEPHYR_VERSION=${{ steps.v.outputs.zephyr }}
            ZSDK_VERSION=${{ steps.v.outputs.sdk }}
            ZSDK_TOOLCHAINS=${{ steps.v.outputs.toolchains }}
            ZEPHYR_BLOBS=${{ steps.v.outputs.blobs }}
          push: ${{ github.event_name != 'workflow_dispatch' || inputs.push }}
          tags: |
            ${{ steps.p.outputs.prefix }}/zephyr-workshop-ci:${{ steps.v.outputs.pair }}
            ${{ steps.p.outputs.prefix }}/zephyr-workshop-ci:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=Zephyr CI build (GitHub Actions) image - Zephyr ${{ steps.v.outputs.zephyr }}, SDK ${{ steps.v.outputs.sdk }}
          cache-from: type=gha,scope=ci
          cache-to: type=gha,scope=ci,mode=max

      - name: Summary
        run: |
          {
            echo "### Published"
            echo ""
            echo '| Image | Tag |'
            echo '|---|---|'
            echo "| \`${{ steps.p.outputs.prefix }}/zephyr-workshop-devel\` | \`${{ steps.v.outputs.pair }}\`, \`latest\` |"
            echo "| \`${{ steps.p.outputs.prefix }}/zephyr-workshop-ci\` | \`${{ steps.v.outputs.pair }}\`, \`latest\` |"
            echo ""
            echo "Zephyr ${{ steps.v.outputs.zephyr }}, SDK ${{ steps.v.outputs.sdk }}"
          } >> "$GITHUB_STEP_SUMMARY"
