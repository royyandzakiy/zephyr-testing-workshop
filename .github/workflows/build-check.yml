# Proves the toolchain works by building an upstream sample, not this repo, so a
# failure here is the environment. Run it to check a new self-hosted runner.

name: Build check

on:
  workflow_dispatch:

jobs:
  hosted:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    container:
      image: ghcr.io/royyandzakiy/zephyr-devcontainer-ci:z4.4.0-sdk1.0.1

    defaults:
      run:
        shell: bash

    steps:
      - name: Build and run hello_world
        run: |
          set -euo pipefail
          west build -b native_sim/native "$ZEPHYR_BASE/samples/hello_world" -d build -p
          # -stop_at makes native_sim exit on its own, so the exit code and output are real.
          ./build/zephyr/zephyr.exe -stop_at=1 > run.log 2>&1
          cat run.log
          grep -q "Hello World" run.log

  self-hosted:
    runs-on: [self-hosted, linux]
    timeout-minutes: 15

    defaults:
      run:
        shell: bash

    steps:
      # The runner must run inside the devcontainer, where the SDK lives.
      # Without this check the build fails later with a less clear error.
      - name: Check the runner can see the SDK
        run: |
          set -euo pipefail
          for v in ZEPHYR_BASE ZEPHYR_SDK_INSTALL_DIR ZEPHYR_TOOLCHAIN_VARIANT; do
            [ -n "${!v:-}" ] || { echo "::error::$v is unset. Is this runner inside the devcontainer?"; exit 1; }
          done
          test -f "$ZEPHYR_BASE/VERSION" || { echo "::error::no Zephyr checkout at $ZEPHYR_BASE"; exit 1; }

      - name: Build and run hello_world
        run: |
          set -euo pipefail
          west build -b native_sim/native "$ZEPHYR_BASE/samples/hello_world" -d build -p
          ./build/zephyr/zephyr.exe -stop_at=1 > run.log 2>&1
          cat run.log
          grep -q "Hello World" run.log
