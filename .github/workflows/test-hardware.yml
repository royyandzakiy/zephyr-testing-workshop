# Proves this repo's firmware builds, flashes and passes its tests on a real board.
# Manual, since it needs a self-hosted runner with the board attached.
# For your own hardware, change BOARD below and apps/05-shell-pytest/hardware-map.yaml.

name: Tests (hardware)

on:
  workflow_dispatch:

env:
  BOARD: nrf5340dk/nrf5340/cpuapp

jobs:
  hardware:
    runs-on: [self-hosted, linux]
    timeout-minutes: 30

    # One job at a time: two runs flashing the same board would interleave and both fail.
    concurrency:
      group: hardware
      cancel-in-progress: false

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      # west picks the runner from the build directory, so this works for nRF, ESP32
      # and Nucleo alike. With one probe attached no serial number is needed.
      - name: Build and flash an app
        run: |
          set -euo pipefail
          west build -b "$BOARD" apps/01-blinky -d build -p
          west flash -d build

      # Twister builds and flashes itself, with the probe and serial port from the hardware map.
      - name: Run the shell and emul suite on the board
        run: |
          set -euo pipefail
          west twister --device-testing \
            --hardware-map apps/05-shell-pytest/hardware-map.yaml \
            -T apps/05-shell-pytest

      # Keeps all of twister-out/, since a hardware failure cannot be rerun without the board.
      - name: Upload twister output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: twister-out
          path: twister-out/
          if-no-files-found: warn
