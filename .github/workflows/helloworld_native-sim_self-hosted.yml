name: Hello_Self-Hosted

# The self-hosted twin of Hello_CI. Same build, different machine: this one runs
# on your own runner instead of a GitHub-hosted one.
#
# Its real job is to answer "is the self-hosted runner healthy?" in ~30 seconds,
# without needing a board plugged in. The two hardware workflows depend on this
# runner working; when one of them fails, run this first to tell a broken runner
# apart from a broken board.
#
# Differences from Hello_CI, all consequences of where it runs:
#
#   no `container:`  the runner already lives inside the devel image, started
#                    from the devcontainer. Nesting a container would give it a
#                    second, SDK-less environment.
#   no ZEPHYR_* env  those come from devcontainer.json's containerEnv, which
#                    tracks versions.env. Repeating them here would be a fourth
#                    place to keep in sync, and would silently win if it drifted.
#   no SDK steps     setup-sdks.sh installed and registered the SDK at container
#                    start.
#   no actions/cache the runner is persistent, so ccache survives between runs on
#                    its own. Uploading it to GitHub's cache would be slower.

on:
  workflow_dispatch:

jobs:
  build_and_run:
    runs-on: [self-hosted, linux]
    timeout-minutes: 15

    defaults:
      run:
        shell: bash

    env:
      BOARD_TYPE: "native_sim/native"
      CCACHE_DIR: /root/.cache/ccache

    steps:
      # Without a container, the environment is the thing most likely to be
      # wrong -- a runner started outside the devcontainer, or started before
      # setup-sdks.sh finished, has no usable Zephyr. Fail here with something
      # readable rather than in CMake.
      - name: Preflight — runner is inside a working Zephyr environment
        run: |
          set -euo pipefail
          fail=0
          for v in ZEPHYR_BASE ZEPHYR_SDK_INSTALL_DIR ZEPHYR_TOOLCHAIN_VARIANT; do
            if [ -z "${!v:-}" ]; then
              echo "::error::$v is unset — is this runner running inside the devcontainer?"
              fail=1
            else
              echo "  $v=${!v}"
            fi
          done
          [ "$fail" -eq 0 ] || exit 1
          test -f "$ZEPHYR_BASE/VERSION" \
            || { echo "::error::no Zephyr checkout at $ZEPHYR_BASE"; exit 1; }
          test -f "$ZEPHYR_SDK_INSTALL_DIR/cmake/Zephyr-sdkConfig.cmake" \
            || { echo "::error::SDK at $ZEPHYR_SDK_INSTALL_DIR is incomplete"; exit 1; }
          # The CMake user package registry lives in the container's throwaway
          # layer; setup-sdks.sh rewrites it on every start. If it is empty,
          # builds fail with an opaque "Could not find a package configuration
          # file provided by Zephyr-sdk".
          ls "$HOME/.cmake/packages/Zephyr-sdk/"* >/dev/null 2>&1 \
            || { echo "::error::no Zephyr-sdk entry in $HOME/.cmake/packages — run /opt/devcontainer/register-sdks.sh"; exit 1; }
          west --version
          echo "Zephyr $(sed -n 's/^VERSION_MAJOR *= *//p' "$ZEPHYR_BASE/VERSION").$(sed -n 's/^VERSION_MINOR *= *//p' "$ZEPHYR_BASE/VERSION")"

      - name: Build minimal hello world
        run: |
          set -euo pipefail
          rm -rf build
          west build -b "$BOARD_TYPE" "$ZEPHYR_BASE"/samples/basic/minimal -d build -p \
            -- -DZEPHYR_SCACHE=ccache

      - name: Run hello world
        run: |
          set -uo pipefail
          timeout 10s ./build/zephyr/zephyr.exe || true

      - name: Show ccache stats
        if: always()
        run: ccache -s || true
