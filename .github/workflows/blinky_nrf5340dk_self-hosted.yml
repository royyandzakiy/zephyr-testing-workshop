name: Blinky_Self-Hosted

on:
  workflow_dispatch:

jobs:
  build_for_hw_test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    container:
      image: ghcr.io/royyandzakiy/zephyr-devcontainer-ci:z4.4.2-sdk1.0.1

    defaults:
      run:
        shell: bash

    env:
      ZEPHYR_VERSION: v4.4.2
      ZEPHYR_TOOLCHAIN_VERSION: 1.0.1
      BOARD_TYPE: "nrf5340dk/nrf5340/cpuapp"
      CCACHE_DIR: /__w/.ccache

    steps:
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: /__w/.ccache
          key: ${{ runner.os }}-ccache-${{ env.BOARD_TYPE }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-${{ env.BOARD_TYPE }}-

      - name: Build blinky
        run: |
          set -euo pipefail
          rm -rf build
          west build -b "$BOARD_TYPE" "$ZEPHYR_BASE"/samples/basic/blinky -d build \
            -- -DZEPHYR_SCACHE=ccache
          ccache -s || true

      - name: Create build tarball
        run: |
          set -euo pipefail
          tar czf build.tar.gz build/zephyr/zephyr.hex

      - name: Upload tarball
        uses: actions/upload-artifact@v4
        with:
          name: build.tar.gz
          path: build.tar.gz

  hw_flash_and_test:
    needs: build_for_hw_test
    runs-on: [self-hosted, linux]
    timeout-minutes: 15

    concurrency:
      group: hw-nrf5340dk
      cancel-in-progress: false

    defaults:
      run:
        shell: bash
        working-directory: blinky-test

    env:
      CI_NRF5340DK_SNR: "1050073602" # change this to YOUR BOARD ID
      # CI_NRF5340DK_SNR: ${{ vars.CI_NRF5340DK_SNR }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          path: blinky-test

      - name: USB diagnostics
        run: |
          echo "=== SEGGER devices ==="
          lsusb -d 1366: || echo "no SEGGER device"
          echo "=== USB nodes ==="
          ls -l /dev/bus/usb/*/*
          echo "=== nrfutil view ==="
          nrfutil device list || true

      - name: Preflight — toolchain and probe present
        run: |
          set -euo pipefail
          nrfutil --version
          echo "--- connected probes ---"
          nrfutil device list --json | jq -r '.. | .serialNumber? // empty' | sed 's/^0*//' | tr -d '\r' > /tmp/snrs.txt
          cat /tmp/snrs.txt
          if ! grep -qx "$CI_NRF5340DK_SNR" /tmp/snrs.txt; then
            echo "::error::J-Link $CI_NRF5340DK_SNR not found. Check USB passthrough / board power."
            exit 1
          fi

      - name: Download build tarball
        uses: actions/download-artifact@v4
        with:
          name: build.tar.gz
          path: blinky-test/samples/blinky

      - name: Untar
        run: |
          set -euo pipefail
          cd samples/blinky
          rm -rf build
          tar xzf build.tar.gz
          test -f build/zephyr/zephyr.hex

      - name: Flash
        run: |
          set -euo pipefail
          cd samples/blinky
          nrfutil device erase     --serial-number "$CI_NRF5340DK_SNR"
          nrfutil device program   --serial-number "$CI_NRF5340DK_SNR" --firmware build/zephyr/zephyr.hex
          nrfutil device fw-verify --serial-number "$CI_NRF5340DK_SNR" --firmware build/zephyr/zephyr.hex
          nrfutil device reset     --serial-number "$CI_NRF5340DK_SNR"

      - name: Recover on failure
        if: failure()
        run: |
          nrfutil device recover --serial-number "$CI_NRF5340DK_SNR" || true
          for i in $(seq 30); do
            nrfutil device list --json | jq -r '.. | .serialNumber? // empty' \
              | grep -qx "$CI_NRF5340DK_SNR" && exit 0
            sleep 1
          done
          echo "::error::probe did not re-enumerate after recover"; exit 1

      - name: Leave board in a clean state
        if: always()
        run: nrfutil device reset --serial-number "$CI_NRF5340DK_SNR" || true