tests:
  app12.button.robot:
    # Selects the renode variant by feature, not by name. Naming it in platform_allow
    # fails any run without this app's --board-root, such as `west twister -T apps/`.
    depends_on: renode
    harness: robot
    harness_config:
      robot_testsuite: tests/robot/button_toggle.robot
