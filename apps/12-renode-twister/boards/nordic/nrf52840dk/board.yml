# Adds a variant to Zephyr's own nrf52840dk: nrf52840dk/nrf52840/renode. It builds the
# same firmware as nrf52840dk/nrf52840. What differs is nrf52840dk_nrf52840_renode.yaml,
# which tells Twister the target runs in Renode.
board:
  extend: nrf52840dk
  variants:
    - name: renode
      qualifier: nrf52840
