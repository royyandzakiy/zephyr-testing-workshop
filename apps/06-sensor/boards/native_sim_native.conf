# Puts the console on the terminal that launched zephyr.exe.
CONFIG_UART_NATIVE_PTY_0_ON_STDINOUT=y

# Alternative: console on its own pseudo-terminal
# CONFIG_UART_NATIVE_PTY_0_ON_OWN_PTY=y

# Enables the emulation framework. CONFIG_I2C_EMUL then defaults to y, since
# native_sim.dts already declares an i2c-emul-controller.
CONFIG_EMUL=y
