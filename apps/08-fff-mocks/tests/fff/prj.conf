CONFIG_ZTEST=y
CONFIG_PRINTK=y

# No CONFIG_GPIO, no CONFIG_I2C, no CONFIG_SENSOR. Nothing under test here
# touches a driver, so nothing here enables one. A test image that pulls in
# subsystems it does not use is a slower build and a wider blast radius for
# unrelated breakage.
#
# <zephyr/fff.h> needs nothing: ztest already puts it on the include path.
