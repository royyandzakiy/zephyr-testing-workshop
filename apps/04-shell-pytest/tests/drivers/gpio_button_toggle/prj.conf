CONFIG_STDOUT_CONSOLE=y
CONFIG_PRINTK=y
# Colour codes would end up in the lines pytest matches on.
CONFIG_SHELL_VT100_COLORS=n

# Emulated GPIO controller that test_harness.c drives.
CONFIG_GPIO_EMUL=y
CONFIG_GPIO=y

# Shell over the console UART, for the test_btn command.
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y