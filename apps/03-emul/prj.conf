CONFIG_GPIO=y
CONFIG_PRINTK=y

# CONFIG_GPIO_EMUL is deliberately absent. The emulated controller turns
# itself on wherever the devicetree instantiates a `zephyr,gpio-emul` node
# (the driver's Kconfig is `default y` on DT_HAS_ZEPHYR_GPIO_EMUL_ENABLED),
# so boards/native_sim_native.overlay is the only thing that decides.
