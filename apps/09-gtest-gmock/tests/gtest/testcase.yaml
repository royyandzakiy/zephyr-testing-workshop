tests:
  app09.feeder.gtest:
    # native_sim only: a real target would need a full standard library, a large
    # heap and 32 kB of stack for the runner (see the README's Trivia section).
    platform_allow:
      - native_sim
    tags:
      - feeder
      - unit
      - gtest
      - cpp

    # Parses GoogleTest's console output and reports one result per test.
    harness: gtest
