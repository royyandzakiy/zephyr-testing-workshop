tests:
  app09.feeder.gtest:
    # native_sim only. On a real target you would have to find a standard
    # library, a heap and 32 kB of stack for the test runner, which is the
    # conversation the README's Trivia section is about.
    platform_allow:
      - native_sim
    tags:
      - feeder
      - unit
      - gtest
      - cpp

    # Twister has a harness for GoogleTest. It reads the console the way
    # `harness: console` does, but it knows what GoogleTest output means, so it
    # reports one result per test instead of one for the whole binary.
    harness: gtest
