CONFIG_PRINTK=y
CONFIG_STDOUT_CONSOLE=y

CONFIG_CPP=y
CONFIG_STD_CPP2B=y

# GoogleTest needs all three. It throws to unwind out of a failed assertion in
# a helper, it uses dynamic_cast in the matcher machinery, and it leans on
# std::string, std::vector and streams throughout.
#
# REQUIRES_FULL_LIBCPP is the one that gives it a real standard library.
# GLIBCXX_LIBCPP looks like the right symbol and is not: it depends on
# NEWLIB_LIBC || PICOLIBC, which native_sim does not use, so Kconfig discards
# it silently. See the Trivia section of the README.
CONFIG_CPP_EXCEPTIONS=y
CONFIG_CPP_RTTI=y
CONFIG_REQUIRES_FULL_LIBCPP=y

# Every TEST and EXPECT_CALL registers itself before main() runs, and gtest
# allocates freely. Both of these are far larger than a normal Zephyr app
# needs, and that is part of what this app is showing you.
CONFIG_HEAP_MEM_POOL_SIZE=262144
CONFIG_MAIN_STACK_SIZE=32768
