CONFIG_PRINTK=y
CONFIG_STDOUT_CONSOLE=y

CONFIG_CPP=y
CONFIG_STD_CPP2B=y

# GoogleTest and gmock need exceptions, RTTI and a full standard library.
# REQUIRES_FULL_LIBCPP, not GLIBCXX_LIBCPP: the latter depends on NEWLIB_LIBC
# or PICOLIBC, which native_sim does not use, so Kconfig silently drops it.
# See the Trivia section of the README.
CONFIG_CPP_EXCEPTIONS=y
CONFIG_CPP_RTTI=y
CONFIG_REQUIRES_FULL_LIBCPP=y

# 256 kB heap and 32 kB main stack: every TEST and EXPECT_CALL registers
# before main() and gtest allocates freely, far beyond a normal Zephyr app.
CONFIG_HEAP_MEM_POOL_SIZE=262144
CONFIG_MAIN_STACK_SIZE=32768
