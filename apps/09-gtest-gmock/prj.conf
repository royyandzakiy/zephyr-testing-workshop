CONFIG_PRINTK=y

# C++, at the 2b standard. CONFIG_STD_CPP2B is what puts -std=c++2b on the
# command line.
CONFIG_CPP=y
CONFIG_STD_CPP2B=y

# The app itself needs nothing from the standard library, but tests/gtest does
# and it is easier to reason about one answer than two. See tests/gtest/prj.conf
# for why this symbol and not CONFIG_GLIBCXX_LIBCPP.
CONFIG_REQUIRES_FULL_LIBCPP=y
