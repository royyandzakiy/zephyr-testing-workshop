CONFIG_PRINTK=y

# C++, at the 2b standard. CONFIG_STD_CPP2B is what puts -std=c++2b on the
# command line, which is what makes std::to_underlying in
# include/climate/logic.hpp legal.
CONFIG_CPP=y
CONFIG_STD_CPP2B=y

# include/climate/ports.hpp includes <concepts>, and Zephyr's minimal C++
# subset does not carry the standard library headers.
#
# The symbol to use here is REQUIRES_FULL_LIBCPP, not GLIBCXX_LIBCPP. The
# latter `depends on NEWLIB_LIBC || PICOLIBC`, neither of which native_sim
# uses, so Kconfig would drop it without a word. REQUIRES_FULL_LIBCPP has no
# such dependency, and on a native build the LIBCPP_IMPLEMENTATION choice
# defaults to EXTERNAL_LIBCPP, which is the host's libstdc++.
CONFIG_REQUIRES_FULL_LIBCPP=y

CONFIG_HEAP_MEM_POOL_SIZE=16384
