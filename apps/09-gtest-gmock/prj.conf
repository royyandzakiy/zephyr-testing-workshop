CONFIG_PRINTK=y

# C++ with -std=c++2b, needed for std::to_underlying in portion.hpp.
CONFIG_CPP=y
CONFIG_STD_CPP2B=y

# Full C++ standard library: the minimal one has no <utility> or <cerrno>.
# See tests/gtest/prj.conf for why this symbol and not CONFIG_GLIBCXX_LIBCPP.
CONFIG_REQUIRES_FULL_LIBCPP=y
