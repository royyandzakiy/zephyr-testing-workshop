# Put the first PTY UART on the stdin/stdout of the shell that launched
# zephyr.exe, so `./build/zephyr/zephyr.exe` prints straight into your
# terminal instead of allocating a separate pty you have to attach to.
#
# Zephyr picks this file up automatically for board target native_sim/native
# -- the filename is the board target with '/' replaced by '_'.
CONFIG_UART_NATIVE_PTY_0_ON_STDINOUT=y
