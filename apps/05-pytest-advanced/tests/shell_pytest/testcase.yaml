# tests/shell_pytest/testcase.yaml
#
# One directory, three scenarios. Twister builds the image once per scenario,
# so splitting a slow suite from a fast one costs nothing but a second entry
# here.
#
# `pytest_root`, which narrows a scenario to one file, is in
# docs/reference/pytest-harness.md. A scenario for it here would only re-run
# tests that app05.shell.pytest.full already runs.

common:
  build_only: false
  platform_allow:
    - native_sim
    - nrf5340dk/nrf5340/cpuapp
    - nucleo_g474re
    - esp32s3_devkitc/esp32s3/procpu
  tags:
    - shell
    - pytest

tests:
  # Everything except what is marked slow. This is the one you want in a
  # pre-commit hook.
  app05.shell.pytest.smoke:
    harness: pytest
    harness_config:
      pytest_args:
        - "-m"
        - "not slow"

  # The whole suite, slow cases included.
  app05.shell.pytest.full:
    harness: pytest
    tags:
      - slow

  # No Python at all. The built-in shell harness does string matching and
  # nothing more, which is often enough. It sits next to the pytest scenarios
  # so you can compare the two.
  app05.shell.builtin_harness:
    harness: shell
    harness_config:
      shell_commands:
        - command: "app led"
          expected: "led=off"
        - command: "app btn 1"
          expected: "btn=done count=1"
        - command: "app led"
          expected: "led=on"
