# tests/shell_pytest/testcase.yaml
#
# One directory, four scenarios. Twister builds the image once per scenario,
# so this is also a demonstration of the cheapest knob you have: splitting a
# slow suite from a fast one costs nothing but a second entry here.

common:
  build_only: false
  platform_allow:
    - native_sim
    - nrf5340dk/nrf5340/cpuapp
    - nucleo_g474re
    - esp32s3_devkitc/esp32s3/procpu
  tags:
    - shell
    - pytest

tests:
  # Everything except what is marked slow. This is the one you want in a
  # pre-commit hook.
  app05.shell.pytest.smoke:
    harness: pytest
    harness_config:
      pytest_args:
        - "-m"
        - "not slow"

  # The whole suite, slow cases included.
  app05.shell.pytest.full:
    harness: pytest
    tags:
      - slow

  # One file, nothing else. Handy when you are iterating on a single test and
  # do not want to wait for the other three files.
  app05.shell.pytest.parametrize:
    harness: pytest
    harness_config:
      pytest_root:
        - "pytest/test_parametrize.py"

  # No Python at all. The built-in shell harness does string matching and
  # nothing more, which is often enough -- and is worth seeing next to the
  # pytest scenarios so the extra machinery has something to justify itself
  # against.
  app05.shell.builtin_harness:
    harness: shell
    harness_config:
      shell_commands:
        - command: "app led"
          expected: "led=off"
        - command: "app btn 1"
          expected: "btn=done count=1"
        - command: "app led"
          expected: "led=on"
