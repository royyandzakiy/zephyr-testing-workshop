# Three scenarios from one directory; splitting slow from fast tests is one
# more entry. `pytest_root`, which narrows a scenario to one file, is covered
# in docs/reference/pytest-harness.md.

common:
  build_only: false
  platform_allow:
    - native_sim
    - nrf5340dk/nrf5340/cpuapp
    - nucleo_g474re
    - esp32s3_devkitc/esp32s3/procpu
  tags:
    - shell
    - pytest

tests:
  # Everything except tests marked slow, fast enough for a pre-commit hook.
  app05.shell.pytest.smoke:
    harness: pytest
    harness_config:
      pytest_args:
        - "-m"
        - "not slow"

  # The whole suite, slow cases included.
  app05.shell.pytest.full:
    harness: pytest
    tags:
      - slow

  # The built-in shell harness: plain string matching, no Python. Kept next to
  # the pytest scenarios for comparison.
  app05.shell.builtin_harness:
    harness: shell
    harness_config:
      shell_commands:
        - command: "app led"
          expected: "led=off"
        - command: "app btn 1"
          expected: "btn=done count=1"
        - command: "app led"
          expected: "led=on"
