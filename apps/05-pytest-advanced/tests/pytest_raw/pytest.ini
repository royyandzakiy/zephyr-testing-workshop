# tests/pytest_raw/pytest.ini
#
# Deliberately its own rootdir. Twister supplies all of this for the suite in
# tests/shell_pytest/, and the point of this directory is to show what twister
# was doing for you.

[pytest]
testpaths = .
addopts = -v --strict-markers
log_cli = true
log_cli_level = INFO
markers =
    e2e: spawns the native_sim binary
